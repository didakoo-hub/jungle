<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="title" content="Jungle didakoo">
    <meta name="description" content="A decentralized Web3 browser game: rule the jungle with your animals. Online matches are played on-chain on Polygon.">
    <meta property="og:title" content="Jungle didakoo" />
    <meta property="og:description" content="A decentralized Web3 browser game: rule the jungle with your animals. Online matches are played on-chain on Polygon." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://jungle.didakoo.eth.limo/og-image.jpg" />
    <meta property="og:url" content="https://jungle.didakoo.eth.limo" />
    <title>Jungle didakoo</title>
    <link rel="icon" type="image/svg+xml" href="resources/images/site-icon.svg" />

    <style>
        :root {
            --bg: #000000;
            --fill: rgb(238, 94, 129);
        }
        html, body {
            background-color: var(--bg);
        }
        .hourglass {
            display: block;
            margin: 3em auto;
            width: 2em;
            height: 4em;
            animation: hourglass 1.5s linear infinite;
        }
        .outer, .sand {
            fill: var(--fill);
        }
        .sand {
            transform-box: view-box;
            animation: 1.5s linear infinite;
        }
        .sand-top {
            transform-origin: 0 103px;
            animation-name: sand-top;
        }
        .sand-bottom {
            transform-origin: 0 206px;
            animation-name: sand-bottom;
        }
        @keyframes hourglass {
            0%, 80% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(180deg);
            }
        }
        @keyframes sand-top {
            0% {
                transform: scaleY(1);
            }
            80%, 100% {
                transform: scaleY(0);
            }
        }
        @keyframes sand-bottom {
            0% {
                transform: scaleY(0);
            }
            80%, 100% {
                transform: scaleY(1);
            }
        }
        #loader {
            z-index: 1090;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .loading-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: var(--bg);
        }

        .load-container{
            display: flex;
            flex-direction: column-reverse;
            align-items: center;
            gap: 20px;
        }

        .image-container{
            display: flex;
        }

        .image-elephant{
            width: 110px;
            height: 110px;
        }

        @media (max-width: 720px){
            .image-elephant{
                width: 95px;
                height: 95px;
            }
        }
    </style>
</head>

<body>

<div id="loader" class="loading-container">
    <div class="load-container">
        <div class="wrapper">
            <svg class="hourglass" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 206" preserveAspectRatio="none">
                <clipPath id="bulbs">
                    <path d="M77.1 133.2C87.5 140.9 92 145 92 152.6V178H28v-25.4c0-7.6 4.5-11.7 14.9-19.4 6-4.5 13-9.6 17.1-17 4.1 7.4 11.1 12.6 17.1 17zM60 89.7c-4.1-7.3-11.1-12.5-17.1-17C32.5 65.1 28 61 28 53.4V28h64v25.4c0 7.6-4.5 11.7-14.9 19.4-6 4.4-13 9.6-17.1 16.9z"/>
                </clipPath>
                <g clip-path="url(#bulbs)">
                    <rect class="sand sand-top" width="120" height="103"/>
                    <rect class="sand sand-bottom" y="103" width="120" height="103"/>
                </g>
                <path class="outer" d="M93.7 95.3c10.5-7.7 26.3-19.4 26.3-41.9V0H0v53.4c0 22.5 15.8 34.2 26.3 41.9 3 2.2 7.9 5.8 9 7.7-1.1 1.9-6 5.5-9 7.7C15.8 118.4 0 130.1 0 152.6V206h120v-53.4c0-22.5-15.8-34.2-26.3-41.9-3-2.2-7.9-5.8-9-7.7 1.1-2 6-5.5 9-7.7zM70.6 103c0 18 35.4 21.8 35.4 49.6V192H14v-39.4c0-27.9 35.4-31.6 35.4-49.6S14 81.2 14 53.4V14h92v39.4C106 81.2 70.6 85 70.6 103z"/>
            </svg>
        </div>
        <div class="image-container">
            <img class="image-elephant" src="resources/images/board/animals/elephant_4.svg" alt="didakoo">
        </div>
    </div>
</div>

<div id="app"></div>

<script type="module" src="/resources/js/app.js"></script>
</body>
</html>
