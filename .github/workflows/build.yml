name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: build
        run: npm run build
      - name: CSP
        run: node tools/csp.js --check dist/index.html
      - name: kubo
        run: |
          v=v0.43.0; f=kubo_${v}_linux-amd64.tar.gz
          get() { curl -fsSLO --connect-timeout 20 --max-time 120 --retry 3 --retry-all-errors "$1"; }
          get https://dist.ipfs.tech/kubo/$v/$f || get https://github.com/ipfs/kubo/releases/download/$v/$f
          echo "6af21cd24a307d94326807b3d3827064c74fb7122f83b6940af250e6ae40da250e0ec0e1f3551256b78cd204623ed56c32ce735bbe28bdcc787b36943c52458a  $f" | sha512sum -c
          tar xzf $f && sudo mv kubo/ipfs /usr/local/bin/ipfs
      - name: CID
        run: |
          ipfs init >/dev/null
          ipfs add -rQ --only-hash --cid-version 1 dist

      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.1
      - name: forge test
        working-directory: contracts
        run: forge test -vv
